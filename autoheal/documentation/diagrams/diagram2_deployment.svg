<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 420" width="990" height="420">
    <defs>
        <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="990" height="420" fill="#ffffff" />
    <rect x="10" y="10" width="970" height="400" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title Banner -->
    <rect x="25" y="25" width="940" height="55" rx="6" fill="#0f172a" />
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AutoHeal & ShopSphere — Verified Deployment Diagram</text>
    <text x="45" y="68" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Physical processes, boundaries, ports (:8000, :8501), SQLite WAL database path, and model artifact</text>
    
    
    <rect x="40" y="105" width="280" height="280" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
    <text x="56" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Client Layer (Web Browser)</text>
    <text x="56" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Edge Interactive Clients</text>
    <text x="56" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">1. AutoHeal SOC Single Page App</text>
<text x="56" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">   URL: http://localhost:8000/</text>
<text x="56" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">   Tech: Vanilla JS, CSS3 Dark Navy,</text>
<text x="56" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">   Chart.js, FontAwesome, Toastr</text>
<text x="56" y="219" font-family="Arial, sans-serif" font-size="11" fill="#334155"></text>
<text x="56" y="237" font-family="Arial, sans-serif" font-size="11" fill="#334155">2. ShopSphere Storefront</text>
<text x="56" y="255" font-family="Arial, sans-serif" font-size="11" fill="#334155">   URL: http://localhost:8000/shop</text>
<text x="56" y="273" font-family="Arial, sans-serif" font-size="11" fill="#334155">   Tech: Jinja2, HTML5, Vanilla JS</text>
<text x="56" y="291" font-family="Arial, sans-serif" font-size="11" fill="#334155"></text>
<text x="56" y="309" font-family="Arial, sans-serif" font-size="11" fill="#334155">3. 3D Spatial Topology Visualizer</text>
<text x="56" y="327" font-family="Arial, sans-serif" font-size="11" fill="#334155">   URL: http://localhost:8501/</text>
<text x="56" y="345" font-family="Arial, sans-serif" font-size="11" fill="#334155">   Tech: Streamlit, Three.js WebGL</text>

    
    <rect x="350" y="105" width="300" height="280" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
    <text x="366" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Process 1: ASGI Host (:8000)</text>
    <text x="366" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Python 3.12 Uvicorn Runtime</text>
    <text x="366" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">Executable: python server.py</text>
<text x="366" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">Active Port: 0.0.0.0:8000 (HTTP/1.1)</text>
<text x="366" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">Runtime Modules:</text>
<text x="366" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- FastAPI Application (server.py)</text>
<text x="366" y="219" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AppSecProtectionMiddleware</text>
<text x="366" y="237" font-family="Arial, sans-serif" font-size="11" fill="#334155">- ShopSphere E-Commerce API</text>
<text x="366" y="255" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AutoHeal AppSec Management API</text>
<text x="366" y="273" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Security Tester Runner (Localhost only)</text>
<text x="366" y="291" font-family="Arial, sans-serif" font-size="11" fill="#334155">- 5 Security Pipeline Agents</text>
<text x="366" y="309" font-family="Arial, sans-serif" font-size="11" fill="#334155">- In-Memory Rate Limiter (8s window)</text>

    
    <rect x="680" y="105" width="270" height="280" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
    <text x="696" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Local Storage & Model Tier</text>
    <text x="696" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Host Filesystem Persistence</text>
    <text x="696" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">Base Path: C:\Users\...\AD\autoheal\</text>
<text x="696" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155"></text>
<text x="696" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">1. Primary SQLite Database:</text>
<text x="696" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">   data/shopsphere.db (1.08 MB)</text>
<text x="696" y="219" font-family="Arial, sans-serif" font-size="11" fill="#334155">   WAL Mode enabled, Foreign Keys</text>
<text x="696" y="237" font-family="Arial, sans-serif" font-size="11" fill="#334155"></text>
<text x="696" y="255" font-family="Arial, sans-serif" font-size="11" fill="#334155">2. Machine Learning Model Artifact:</text>
<text x="696" y="273" font-family="Arial, sans-serif" font-size="11" fill="#334155">   models/rf_model.joblib (140 KB)</text>
<text x="696" y="291" font-family="Arial, sans-serif" font-size="11" fill="#334155">   Pre-trained Scikit-Learn weights</text>
<text x="696" y="309" font-family="Arial, sans-serif" font-size="11" fill="#334155"></text>
<text x="696" y="327" font-family="Arial, sans-serif" font-size="11" fill="#334155">3. Forensic Export Outputs:</text>
<text x="696" y="345" font-family="Arial, sans-serif" font-size="11" fill="#334155">   documentation/diagrams/</text>

    <path d="M 320 220 L 350 220" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 650 220 L 680 220" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" />
</svg>