<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420">
    <defs>
        <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="1020" height="420" fill="#ffffff" />
    <rect x="10" y="10" width="1000" height="400" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title Banner -->
    <rect x="25" y="25" width="970" height="55" rx="6" fill="#0f172a" />
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AutoHeal & ShopSphere — End-to-End Sequence Diagram</text>
    <text x="45" y="68" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Complete chronological interactions across User, Attack Center, Gateway, Storefront, Security Pipeline, and Storage</text>
    
    <rect x="15" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="60" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SOC Operator</text><line x1="60" y1="130" x2="60" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="155" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="200" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Attack Center</text><line x1="200" y1="130" x2="200" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="315" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="360" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Middleware (:8000)</text><line x1="360" y1="130" x2="360" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="475" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="520" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Storefront / Shop</text><line x1="520" y1="130" x2="520" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="635" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="680" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Detection / Correlator</text><line x1="680" y1="130" x2="680" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="795" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="840" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Response / Verifier</text><line x1="840" y1="130" x2="840" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><rect x="905" y="100" width="90" height="30" rx="4" fill="#0f172a" /><text x="950" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SQLite DB</text><line x1="950" y1="130" x2="950" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" /><line x1="60" y1="145" x2="200" y2="145" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><rect x="20.0" y="131" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="130.0" y="142" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0284c7" text-anchor="middle">1. Launch Attack Test (failed_logins)</text><line x1="200" y1="175" x2="360" y2="175" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><rect x="170.0" y="161" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="280.0" y="172" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0284c7" text-anchor="middle">2. HTTP POST /api/shop/auth/login</text><line x1="360" y1="200" x2="520" y2="200" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" /><rect x="330.0" y="186" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="440.0" y="197" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0d9488" text-anchor="middle">3. Check Credentials -> 401 Unauthorized</text><line x1="360" y1="225" x2="950" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" /><rect x="545.0" y="211" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="655.0" y="222" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">4. INSERT INTO security_events (AUTH_FAILURE)</text><line x1="360" y1="255" x2="680" y2="255" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" /><rect x="410.0" y="241" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="520.0" y="252" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7c3aed" text-anchor="middle">5. Threshold Reached: Trigger Correlation</text><line x1="680" y1="280" x2="950" y2="280" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" /><rect x="705.0" y="266" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="815.0" y="277" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7c3aed" text-anchor="middle">6. upsert_security_incident (AUTH-001)</text><line x1="680" y1="305" x2="840" y2="305" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" /><rect x="650.0" y="291" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="760.0" y="302" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d97706" text-anchor="middle">7. Handoff to Response & Verification</text><line x1="840" y1="330" x2="950" y2="330" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" /><rect x="785.0" y="316" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="895.0" y="327" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">8. Dynamic Quarantine in blocked_clients (TTL=180s)</text><line x1="840" y1="355" x2="360" y2="355" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" /><rect x="490.0" y="341" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="600.0" y="352" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">9. Synthetic Probes: Attacker=403, Benign=200</text><line x1="840" y1="380" x2="200" y2="380" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" /><rect x="410.0" y="366" width="220" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="520.0" y="377" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">10. Stream Verification Outcome (SSE)</text>
</svg>