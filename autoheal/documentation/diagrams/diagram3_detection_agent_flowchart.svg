<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 260" width="990" height="260">
    <defs>
        <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="990" height="260" fill="#ffffff" />
    <rect x="10" y="10" width="970" height="240" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title Banner -->
    <rect x="25" y="25" width="940" height="55" rx="6" fill="#0f172a" />
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Component 1: Detection Agent Execution Flowchart</text>
    <text x="45" y="68" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Ingress normalization, signature-based pattern matching, Scikit-Learn Random Forest anomaly inference</text>
    
    
    <rect x="40" y="105" width="210" height="120" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
    <text x="56" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1. Ingress Normalization</text>
    <text x="56" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Validation & Feature Prep</text>
    <text x="56" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- URL decode query string</text>
<text x="56" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Sanitize malformed unicode</text>
<text x="56" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Redact sensitive passwords</text>
<text x="56" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Extract method, path, IP</text>

    
    <rect x="280" y="105" width="210" height="120" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
    <text x="296" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2. Deterministic Rules</text>
    <text x="296" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Signature Pattern Matching</text>
    <text x="296" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- INJ-001: SQL Injection</text>
<text x="296" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- XSS-001: Script/DOM Tags</text>
<text x="296" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AUTH-002: Admin Probes</text>
<text x="296" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- High Confidence: 0.94 - 0.99</text>

    
    <rect x="520" y="105" width="210" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
    <text x="536" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3. ML Anomaly Scoring</text>
    <text x="536" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Random Forest Classifier</text>
    <text x="536" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Load models/rf_model.joblib</text>
<text x="536" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Feature Schema (7 features)</text>
<text x="536" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Probability Score (0.0 - 1.0)</text>
<text x="536" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Threshold Check >= 0.45</text>

    
    <rect x="760" y="105" width="190" height="120" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#dropShadow)" />
    <text x="776" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4. Detection Output</text>
    <text x="776" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Structured Object</text>
    <text x="776" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- rule_id & category</text>
<text x="776" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- severity: CRITICAL/HIGH</text>
<text x="776" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- confidence & model_score</text>
<text x="776" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Dispatch to Correlator</text>

    <path d="M 250 165 L 280 165" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 490 165 L 520 165" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" /><path d="M 730 165 L 760 165" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" />
</svg>