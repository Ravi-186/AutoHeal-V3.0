<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 270" width="990" height="270">
    <defs>
        <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="990" height="270" fill="#ffffff" />
    <rect x="10" y="10" width="970" height="250" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title Banner -->
    <rect x="25" y="25" width="940" height="55" rx="6" fill="#0f172a" />
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Component 3: Response Agent Flowchart</text>
    <text x="45" y="68" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Policy lookup, dynamic WAF quarantine with sliding TTL, audit logging, and handoff to verification</text>
    
    
    <rect x="40" y="105" width="210" height="130" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
    <text x="56" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1. Incident Input</text>
    <text x="56" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Evaluated Threat Input</text>
    <text x="56" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Correlated incident ID</text>
<text x="56" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Rule ID & Threat Category</text>
<text x="56" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Target Client IP / Session</text>
<text x="56" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Check dry_run flag</text>

    
    <rect x="280" y="105" width="220" height="130" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
    <text x="296" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2. Policy Evaluation</text>
    <text x="296" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Autonomous Decision Gate</text>
    <text x="296" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Lookup POLICY_RULES</text>
<text x="296" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Action: BLOCK_IP / RATE</text>
<text x="296" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Configured TTL: 180s - 300s</text>
<text x="296" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Safe Loopback exemption</text>

    
    <rect x="530" y="105" width="210" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
    <text x="546" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3. Defensive Action</text>
    <text x="546" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Active Containment</text>
    <text x="546" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Insert into blocked_clients</text>
<text x="546" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Middleware intercepts (403)</text>
<text x="546" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Self-healing seed recovery</text>
<text x="546" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Measure latency (ms)</text>

    
    <rect x="770" y="105" width="180" height="130" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#dropShadow)" />
    <text x="786" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4. Audit & Handoff</text>
    <text x="786" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Audit Trace & Verifier</text>
    <text x="786" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Log mitigation action</text>
<text x="786" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- status: RESPONSE_ATTEMPT.</text>
<text x="786" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Handoff to Verifier</text>
<text x="786" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Ready for verification</text>

    <path d="M 250 170 L 280 170" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 500 170 L 530 170" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" /><path d="M 740 170 L 770 170" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" />
</svg>