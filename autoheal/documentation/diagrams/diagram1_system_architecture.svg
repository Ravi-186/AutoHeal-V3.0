<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 430" width="990" height="430">
    <defs>
        <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="990" height="430" fill="#ffffff" />
    <rect x="10" y="10" width="970" height="410" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title Banner -->
    <rect x="25" y="25" width="940" height="55" rx="6" fill="#0f172a" />
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AutoHeal & ShopSphere — System Architecture Diagram</text>
    <text x="45" y="68" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Verified implementation across Presentation, Gateway, Autonomous Security Pipeline, AI, and Storage Tiers</text>
    
    
    <rect x="40" y="105" width="260" height="140" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
    <text x="56" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1. Presentation Tier</text>
    <text x="56" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Client-Side User Interfaces</text>
    <text x="56" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AutoHeal SOC Dashboard (index.html)</text>
<text x="56" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Attack Center Control Console</text>
<text x="56" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- ShopSphere Storefront (Flipkart Replica)</text>
<text x="56" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- 3D Spatial Topology SOC (:8501 WebGL)</text>

    
    <rect x="330" y="105" width="260" height="140" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
    <text x="346" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2. Gateway & API Tier (:8000)</text>
    <text x="346" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">FastAPI ASGI Runtime & Routes</text>
    <text x="346" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Starlette BaseHTTPMiddleware</text>
<text x="346" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AppSec Protection Middleware</text>
<text x="346" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- ShopSphere REST API (/api/shop/*)</text>
<text x="346" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AutoHeal Admin & Telemetry APIs</text>

    
    <rect x="620" y="105" width="330" height="140" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#dropShadow)" />
    <text x="636" y="127" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3. Autonomous Security Pipeline</text>
    <text x="636" y="141" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">The Five Core Security Components</text>
    <text x="636" y="147" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Comp 1: Detection Agent (Rules + ML)</text>
<text x="636" y="165" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Comp 2: Log Correlation Engine (60s window)</text>
<text x="636" y="183" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Comp 3: Response Agent (Policy WAF Quarantine)</text>
<text x="636" y="201" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Comp 4: Verification Agent (Loopback Probes)</text>
<text x="636" y="219" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Comp 5: Escalation Mechanism (Bounded Retries)</text>

    
    <rect x="40" y="275" width="450" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
    <text x="56" y="297" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4. AI & Intelligence Layer</text>
    <text x="56" y="311" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Anomaly Scoring & Forensics</text>
    <text x="56" y="317" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Scikit-Learn Random Forest Classifier (models/rf_model.joblib)</text>
<text x="56" y="335" font-family="Arial, sans-serif" font-size="11" fill="#334155">- 7 Feature Columns: bytes_sent, failed_logins, connections, cpu, etc.</text>
<text x="56" y="353" font-family="Arial, sans-serif" font-size="11" fill="#334155">- AI Security Advisor & MITRE ATT&CK Mapping (ai_advisor.py)</text>
<text x="56" y="371" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Pure-Python PDF & Full JSON Forensic Report Generators</text>

    
    <rect x="520" y="275" width="430" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
    <text x="536" y="297" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">5. Persistent Telemetry & Storage Tier</text>
    <text x="536" y="311" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">SQLite WAL Engine (data/shopsphere.db)</text>
    <text x="536" y="317" font-family="Arial, sans-serif" font-size="11" fill="#334155">- security_events (Immutable Ingress HTTP Log Stream)</text>
<text x="536" y="335" font-family="Arial, sans-serif" font-size="11" fill="#334155">- security_incidents (Correlated Dossiers & MITRE Records)</text>
<text x="536" y="353" font-family="Arial, sans-serif" font-size="11" fill="#334155">- blocked_clients (Dynamic IP Quarantine with Expiry TTL)</text>
<text x="536" y="371" font-family="Arial, sans-serif" font-size="11" fill="#334155">- Storefront Tables (users, products, orders, cart_items)</text>

    <path d="M 300 175 L 330 175" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 590 175 L 620 175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" /><path d="M 780 245 L 780 275" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" /><path d="M 265 245 L 265 275" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" />
</svg>