version: '3.8'

services:
  # Streamlit Enterprise SOC Dashboard
  soc-dashboard:
    build: .
    container_name: autoheal-soc-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - AUTOHEAL_DETECTION_THRESHOLD=0.45
      - AUTOHEAL_MAX_RETRIES=2
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  # FastAPI AutoHeal Sentinel REST API Service
  api-service:
    build: .
    container_name: autoheal-api-service
    restart: unless-stopped
    command: ["python", "server.py"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AUTOHEAL_API_HOST=0.0.0.0
      - AUTOHEAL_API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
